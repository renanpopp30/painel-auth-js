<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cadastro.css" />
</head>
<body>

  <!-- Fundo decorativo -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main class="wrapper">

    <!-- Lado esquerdo — branding -->
    <aside class="brand">
      <div class="brand-inner">
        <div class="logo">RE</div>
        <h2 class="brand-title">Renda<br /><span>Extra</span></h2>
        <p class="brand-sub">
          Crie sua conta e comece a construir<br />
          sua presença digital hoje.
        </p>

        <ul class="brand-bullets">
          <li>
            <span class="bullet-icon">◆</span>
            Acesso ao painel completo
          </li>
          <li>
            <span class="bullet-icon">◆</span>
            Métricas em tempo real
          </li>
          <li>
            <span class="bullet-icon">◆</span>
            Funil de vendas integrado
          </li>
        </ul>

        <div class="brand-tag">Sistema v1.0</div>
      </div>
    </aside>

    <!-- Lado direito — formulário -->
    <section class="form-panel">
      <div class="form-card">

        <header class="form-header">
          <p class="form-step">Passo 1 de 1</p>
          <h1>Criar conta</h1>
          <p class="form-desc">Preencha os dados abaixo para se cadastrar.</p>
        </header>

        <!-- Nome -->
        <div class="field">
          <label for="nome">Nome completo</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <input type="text" id="nome" placeholder="Seu nome completo" autocomplete="name" />
            <span class="field-status" id="status-nome"></span>
          </div>
          <p class="field-error" id="erro-nome"></p>
        </div>

        <!-- CPF -->
        <div class="field">
          <label for="cpf">CPF</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <path d="M7 8h10M7 12h6M7 16h4"/>
            </svg>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" autocomplete="off" />
            <span class="field-status" id="status-cpf"></span>
          </div>
          <p class="field-error" id="erro-cpf"></p>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m2 7 10 7 10-7"/>
            </svg>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
            <span class="field-status" id="status-email"></span>
          </div>
          <p class="field-error" id="erro-email"></p>
        </div>

        <!-- Senha -->
        <div class="field">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            <button type="button" class="toggle-senha" id="toggle-senha" data-target="senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="senha-forca" id="forca-wrap">
            <div class="forca-bar" id="forca-bar"></div>
            <span class="forca-label" id="forca-label"></span>
          </div>
          <p class="field-error" id="erro-senha"></p>
        </div>

        <!-- Confirmar senha -->
        <div class="field">
          <label for="confirmar-senha">Confirmar senha</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input type="password" id="confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" />
            <button type="button" class="toggle-senha" data-target="confirmar-senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <span class="field-status" id="status-confirmar"></span>
          </div>
          <p class="field-error" id="erro-confirmar"></p>
        </div>

        <!-- Botão -->
        <button class="btn-cadastrar" id="btn-cadastrar" onclick="cadastrar()">
          <span id="btn-text">Criar conta</span>
          <svg id="btn-loader" class="btn-spinner hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </button>

        <!-- Status global -->
        <div class="status-global" id="status-global"></div>

        <p class="login-link">
          Já tem conta? <a href="../index.html">Entrar</a>
        </p>

      </div>
    </section>

  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cadastro.js"></script>
</body>
</html>
